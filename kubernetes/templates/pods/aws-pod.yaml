apiVersion: v1
kind: Pod
metadata:
  name: aws-tools
  namespace: db-adcenter-mongo
spec:
  containers:
  - name: aws-cli
    image: amazon/aws-cli
    command: ["/bin/sh", "-c", "while true; do sleep 30; done;"]
    env:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: s3-adcenter-backups
          key: access
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: s3-adcenter-backups
          key: secret
    - name: AWS_DEFAULT_REGION
      valueFrom:
        secretKeyRef:
          name: s3-adcenter-backups
          key: region
    - name: AWS_S3_URL
      valueFrom:
        secretKeyRef:
          name: s3-adcenter-backups
          key: url